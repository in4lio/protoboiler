[project]
name = "protoboiler"
version = "2.0.0"
description = "Protocol Buffers compiler plugin to quickly generate boilerplate code from your Google Protocol Buffer (proto) definitions."
authors = [
    { name = "Vitaly Kravtsov", email = "in4lio@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE.md"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "protobuf>=5.27.2,<8",
    "f-codec>=0.1.1,<0.2",
]

[project.urls]
Homepage = "https://github.com/in4lio/protoboiler"

[project.scripts]
protoc-gen-protoboiler = "protoboiler:main"

[dependency-groups]
dev = [
    "mypy>=1.11.1",
    "pytest>=8.3",
    # -- provides a bundled `protoc` for the tests and `launcher.py`
    "grpcio-tools>=1.66",
]

[build-system]
requires = ["uv_build>=0.7.19,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
# -- the package lives in the repository root, not in "src/"
module-root = ""
